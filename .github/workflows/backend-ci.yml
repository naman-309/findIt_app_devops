name: FindIt Backend CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Build and Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: findit_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d findit_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Download repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      # Step 3: Install Node.js with pnpm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      # Step 4: Verify installed tool versions
      - name: Verify Node and pnpm
        run: |
          node --version
          pnpm --version

      # Step 5: Install dependencies using the lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Install PostgreSQL command-line client
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Step 7: Create FindIt database roles and schemas
      - name: Configure CI database
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -p 5432 -U postgres -d findit_db -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE auth_service_user LOGIN PASSWORD 'ci_auth_password';
          CREATE ROLE items_service_user LOGIN PASSWORD 'ci_items_password';

          CREATE SCHEMA auth_schema AUTHORIZATION auth_service_user;
          CREATE SCHEMA items_schema AUTHORIZATION items_service_user;

          CREATE EXTENSION IF NOT EXISTS pg_trgm;

          GRANT ALL PRIVILEGES ON DATABASE findit_db TO auth_service_user, items_service_user;

          ALTER ROLE auth_service_user IN DATABASE findit_db SET search_path TO auth_schema, public;
          ALTER ROLE items_service_user IN DATABASE findit_db SET search_path TO items_schema, public;
          SQL

      # Step 8: Run Auth Service database migrations
      - name: Run Auth migrations
        working-directory: backend/apps/auth-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: findit_db
          DB_USER: auth_service_user
          DB_PASSWORD: ci_auth_password
          NODE_ENV: test
        run: node src/database/migrate.js

      # Step 9: Run Items Service database migrations
      - name: Run Items migrations
        working-directory: backend/apps/items-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: findit_db
          DB_USER: items_service_user
          DB_PASSWORD: ci_items_password
          NODE_ENV: test
        run: node src/database/migrate.js

      # Step 10: Start both services and execute API tests with JUnit XML report
      - name: Run Newman API integration tests
        env:
          JWT_SECRET: ci_only_findit_test_secret_change_for_real_deployment
        run: |
          set -euo pipefail

          # Start Auth Service
          (
            cd apps/auth-service

            export NODE_ENV=test
            export PORT=3001
            export DB_HOST=localhost
            export DB_PORT=5432
            export DB_NAME=findit_db
            export DB_USER=auth_service_user
            export DB_PASSWORD=ci_auth_password

            nohup node src/index.js \
              > "$RUNNER_TEMP/findit-auth.log" 2>&1 &
          )

          # Start Items Service
          (
            cd apps/items-service

            export NODE_ENV=test
            export PORT=3002
            export DB_HOST=localhost
            export DB_PORT=5432
            export DB_NAME=findit_db
            export DB_USER=items_service_user
            export DB_PASSWORD=ci_items_password

            nohup node src/index.js \
              > "$RUNNER_TEMP/findit-items.log" 2>&1 &
          )

          # Wait until both services are healthy
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health >/dev/null \
              && curl -fsS http://localhost:3002/health >/dev/null; then
              echo "Both FindIt services are healthy"
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "Services failed to become healthy"
              echo "--- AUTH SERVICE LOGS ---"
              cat "$RUNNER_TEMP/findit-auth.log" || true
              echo "--- ITEMS SERVICE LOGS ---"
              cat "$RUNNER_TEMP/findit-items.log" || true
              exit 1
            fi

            sleep 2
          done

          # Create report directory & execute Postman collection
          mkdir -p newman

          if ! pnpm dlx newman run \
            "tests/postman/FindIt Backend APIs.postman_collection.json" \
            --environment \
            "tests/postman/FindIt Local.postman_environment.json" \
            --bail \
            --reporters cli,junit \
            --reporter-junit-export newman/results.xml; then
            echo "Newman tests failed! Printing service logs..."
            echo "--- AUTH SERVICE LOGS ---"
            cat "$RUNNER_TEMP/findit-auth.log" || true
            echo "--- ITEMS SERVICE LOGS ---"
            cat "$RUNNER_TEMP/findit-items.log" || true
            exit 1
          fi

      # Step 11: Upload JUnit XML report (runs even if tests fail)
      - name: Upload Newman JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit-report
          path: backend/newman/results.xml
          if-no-files-found: warn
          retention-days: 14
      # Step 12: Build Auth Service Docker image
      - name: Build Auth Service image
        run: docker build -f apps/auth-service/Dockerfile -t findit-auth-service:ci .

      # Step 13: Build Items Service Docker image
      - name: Build Items Service image
        run: docker build -f apps/items-service/Dockerfile -t findit-items-service:ci .